<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sanskriti Bhatnagar - a career in 3D</title>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fdf0ea; font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif; }
  canvas { display: block; }
  #panel {
    position: fixed; left: 28px; bottom: 28px; max-width: 420px;
    padding: 20px 24px; border-radius: 24px;
    background: rgba(255,255,255,0.55); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.7);
    box-shadow: 0 18px 50px rgba(180,120,140,0.18);
    opacity: 0; transform: translateY(12px); transition: all .45s ease;
    pointer-events: none;
  }
  #panel.show { opacity: 1; transform: translateY(0); }
  #panel h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; color: #2d2d2d; }
  #panel .years { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #9a8f9d; margin-bottom: 10px; }
  #panel .tags { margin-bottom: 10px; }
  #panel .tags span { display: inline-block; margin: 0 6px 6px 0; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #fff; }
  #panel p { margin: 0; font-size: 14px; line-height: 1.55; color: #4d4348; }
  #panel .metric { margin-top: 10px; font-size: 13px; font-weight: 700; color: #2d2d2d; }
  #hint {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    padding: 10px 20px; border-radius: 999px; font-size: 13px; color: #6d5f66;
    background: rgba(255,255,255,0.5); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.7); white-space: nowrap;
  }
  #brand { position: fixed; top: 22px; left: 28px; font-size: 14px; font-weight: 700; color: #3d3439; letter-spacing: .02em; }
  #brand a { color: inherit; text-decoration: none; }
</style>
</head>
<body>
<div id="brand"><a href="https://www.bsanskriti.com/story" target="_blank" rel="noopener">sanskriti, 2012 to 2026</a></div>
<div id="hint">drag to look around &middot; click a bubble to step inside &middot; esc to come back out</div>
<div id="panel">
  <h1 id="p-title"></h1>
  <div class="years" id="p-years"></div>
  <div class="tags" id="p-tags"></div>
  <p id="p-body"></p>
  <div class="metric" id="p-metric"></div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="./main.js?v=4"></script>
</body>
</html>
